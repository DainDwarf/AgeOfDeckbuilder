name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test

  # The Playwright suite, split by spec across eight runners; one failing shard lets the others finish.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/dependencies
        with:
          key: ${{ secrets.STORE_DEPLOY_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  # A job of its own rather than a step of `pages`: deploy-pages fails on a run that uploaded no artifact.
  tip:
    if: github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    outputs:
      tip: ${{ steps.tip.outputs.tip }}
    steps:
      - id: tip
        shell: bash
        run: |
          main=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$main" = "$GITHUB_SHA" ]; then echo "tip=true"; else echo "tip=false"; fi >> "$GITHUB_OUTPUT"

  pages:
    if: needs.tip.outputs.tip == 'true'
    needs: tip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # The whole history and its tags, so the version the build reads names the last tag.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dependencies
        with:
          key: ${{ secrets.STORE_DEPLOY_KEY }}
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  itch:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      # The whole history and its tags, so the version the build reads names the tag.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dependencies
        with:
          key: ${{ secrets.STORE_DEPLOY_KEY }}
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/butler.zip" https://broth.itch.zone/butler/linux-amd64/15.32.0/archive/default
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - run: npm run itch
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
